<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Productos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; max-width: 800px; }
        
        /* Estilos para las pestañas (Tabs) */
        .pestanas { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
        .tab-btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            background: #e0e0e0;
            margin-right: 5px;
            font-weight: bold;
            border-radius: 5px 5px 0 0;
        }
        .tab-btn.activo { background: #007bff; color: white; }

        /* Contenedores de secciones */
        .seccion { display: none; }
        .seccion.activa { display: block; }

        /* Estilos del Formulario y Tabla */
        form { background: #f4f4f4; padding: 20px; border-radius: 5px; }
        .campo { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 4px; }
        .btn-guardar { background: #28a745; color: white; margin-top: 10px; }
        .btn-editar { background: #ffc107; color: black; }
        .btn-eliminar { background: #dc3545; color: white; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #333; color: white; }
    </style>
</head>
<body>

    <h1>Gestión de Productos</h1>

    <!-- NAVEGACIÓN POR PESTAÑAS -->
    <div class="pestanas">
        <button class="tab-btn activo" id="btn-tab-formulario" onclick="cambiarPestana('formulario')">➕ Agregar Producto</button>
        <button class="tab-btn" id="btn-tab-tabla" onclick="cambiarPestana('tabla')">📦 Ver Todos los Productos</button>
    </div>

    <!-- PESTAÑA 1: FORMULARIO -->
    <div id="seccion-formulario" class="seccion activa">
        <form id="form-producto">
            <h3 id="titulo-form">Agregar Nuevo Producto</h3>
            
            <input type="hidden" id="producto-id">

            <div class="campo">
                <label for="nombre">Nombre del Producto:</label>
                <input type="text" id="nombre" placeholder="Ej. Monitor LG 27 pulgadas" required>
            </div>

            <div class="campo">
                <label for="precio">Precio ($):</label>
                <input type="number" id="precio" step="0.01" placeholder="Ej. 250.00" required>
            </div>

            <button type="submit" class="btn-guardar" id="btn-guardar">Guardar Producto</button>
        </form>
    </div>

    <!-- PESTAÑA 2: VER TODOS LOS PRODUCTOS -->
    <div id="seccion-tabla" class="seccion">
        <h2>Lista Completa de Productos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-productos">
                <!-- Se cargan dinámicamente con JS -->
            </tbody>
        </table>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
